<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-4" [routerLink]="isLoggedIn() ? '/stocks' : '/login'">
            <i class="bi bi-graph-up-arrow me-2"></i>StockTracker
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Show when user IS LOGGED IN -->
            @if (isLoggedIn()) {
            <ul class="navbar-nav me-auto ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link fw-semibold px-3" routerLink="/stocks" routerLinkActive="active">
                        All Stocks
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold px-3" routerLink="/portfolio" routerLinkActive="active">
                        Portfolio
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3 ms-auto">
                <button class="btn btn-outline-danger btn-sm rounded-3 px-3 fw-semibold" (click)="logout()">
                    Logout
                </button>
            </div>
            }

            <!-- Show when user IS NOT LOGGED IN -->
            @else {
            <div class="d-flex align-items-center gap-2 ms-auto">
                <a routerLink="/login" routerLinkActive="active"
                    class="btn btn-outline-light btn-sm rounded-3 px-3 fw-semibold">
                    Login
                </a>
                <a routerLink="/register" routerLinkActive="active"
                    class="btn btn-primary btn-sm rounded-3 px-3 fw-semibold">
                    Register
                </a>
            </div>
            }

        </div>
    </div>
</nav>
